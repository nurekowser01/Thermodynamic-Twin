name: thermodynamic-twin

services:
  llm-advisor:
    build: ./llm-service
    expose:
      - "11435"
    mem_limit: 512m
    mem_reservation: 256m
    env_file:
      - .env
    environment:
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_REQUEST_TIMEOUT: "60"
      TEMPERATURE: "0.0"
      MAX_TOKENS: "256"
      MAX_CONTEXT_CHARS: "3000"
      MAX_CHAT_HISTORY: "4"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11435/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8749"
    mem_limit: 768m
    mem_reservation: 384m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8749/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      PORT: "80"
      BACKEND_URL: http://backend:8749
      LLM_URL: http://llm-advisor:11435
    depends_on:
      backend:
        condition: service_healthy
      llm-advisor:
        condition: service_healthy
    restart: unless-stopped
