services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    mem_limit: 2g
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_CONTEXT_LENGTH=2048
      - OLLAMA_NUM_GPU=1
      - OLLAMA_NUM_GPU_LAYERS=99
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    deploy:
      resources:
        reservations:
          memory: 2g
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, utility]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  llm-advisor:
    build: ./llm-service
    expose:
      - "11435"
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      OLLAMA_REQUEST_TIMEOUT: "45"
      TEMPERATURE: "0.0"
      MAX_TOKENS: "192"
      NUM_CTX: "2048"
      MAX_CONTEXT_CHARS: "2000"
      MAX_CHAT_HISTORY: "3"
      CORS_ORIGINS: http://localhost:8080
      LOG_LEVEL: WARNING
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11435/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8749"
    mem_limit: 768m
    mem_reservation: 384m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8749/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    mem_limit: 128m
    mem_reservation: 64m
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local