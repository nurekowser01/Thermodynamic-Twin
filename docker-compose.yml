services:
  backend:
    build: ./backend
    expose:
      - "8749"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8749/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
